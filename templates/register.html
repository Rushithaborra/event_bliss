<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#7c3aed">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <title>Register — Event Bliss</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="bg-blob blob3"></div>

<div class="center-wrapper">
    <div class="glass-card large-card">
        <h2 style="font-size:26px; margin-bottom:6px; color:#7c3aed;">✨ Create Account</h2>
        <p class="subtitle" style="font-size:13px; color:#a78bca; margin-bottom:22px;">Join Event Bliss as a student</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% if "already exists" in error %}
        <div style="text-align:center; margin-bottom:14px;">
            <a href="/student_login" class="primary-btn" style="display:inline-block; padding:10px 28px; text-decoration:none;">Login Instead →</a>
        </div>
        {% endif %}
        {% endif %}

        <form method="POST" autocomplete="off">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Your full name" required autocomplete="off">

            <label>Username <span style="color:#e07aad;">*</span></label>
            <input type="text" name="username" placeholder="Choose a unique username" required autocomplete="off">

            <label>Email</label>
            <input type="email" id="email-reg" name="email" placeholder="you@example.com" required autocomplete="off" oninput="checkEmail()">
            <div id="email-feedback" style="font-size:11.5px; margin:-8px 0 14px 2px; display:none;"></div>

            <label>Password</label>
            <div style="position:relative; margin-bottom:6px;">
                <input type="password" id="pw-reg" name="password" placeholder="Create a password" required autocomplete="new-password" style="padding-right:42px; margin-bottom:0; width:calc(100% - 32px);" oninput="checkRules('pw-reg','rules-reg'); checkMatch();">
                <button type="button" onclick="togglePw('pw-reg',this)" tabindex="-1" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9d82c0;font-size:16px;line-height:1;padding:0;">👁</button>
            </div>
            <div id="rules-reg" style="font-size:11.5px; margin:0 0 14px 2px; line-height:2; display:none;">
                <span data-rule="len"   style="color:#bbb; margin-right:14px;">✗ 8+ chars</span>
                <span data-rule="upper" style="color:#bbb; margin-right:14px;">✗ Uppercase</span>
                <span data-rule="lower" style="color:#bbb; margin-right:14px;">✗ Lowercase</span>
                <span data-rule="num"   style="color:#bbb; margin-right:14px;">✗ Number</span>
                <span data-rule="spec"  style="color:#bbb;">✗ Special (!@#…)</span>
            </div>

            <label>Confirm Password</label>
            <div style="position:relative; margin-bottom:6px;">
                <input type="password" id="pw-reg-confirm" name="confirm_password" placeholder="Re-enter your password" required autocomplete="new-password" style="padding-right:42px; margin-bottom:0; width:calc(100% - 32px);" oninput="checkMatch()">
                <button type="button" onclick="togglePw('pw-reg-confirm',this)" tabindex="-1" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9d82c0;font-size:16px;line-height:1;padding:0;">👁</button>
            </div>
            <div id="match-feedback" style="font-size:11.5px; margin:0 0 14px 2px; display:none;"></div>

            <button type="submit" class="primary-btn" style="width:100%; margin-top:8px;">Register 🎉</button>
        </form>

        <div style="text-align:center; margin:16px 0 10px; opacity:0.5; font-size:13px;">— or —</div>

        <a href="/google_login" style="
            display:block; text-align:center; padding:11px 16px;
            border-radius:20px;
            background:linear-gradient(135deg,#fde8f5,#ede0ff);
            color:#6d28d9; font-size:14px; font-weight:500;
            text-decoration:none;
            border:1.5px solid #cbb4f4;
            transition:0.3s ease;
        " onmouseover="this.style.boxShadow='0 4px 14px rgba(203,180,244,0.5)'"
           onmouseout="this.style.boxShadow='none'">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                 width="16" style="vertical-align:middle; margin-right:8px;">
            Sign up with Google
        </a>

        <div style="text-align:center; margin-top:16px; font-size:13px; color:#a78bca;">
            Already have an account? <a href="/student_login" style="color:#7c3aed; font-weight:600;">Login</a>
        </div>

        <div style="text-align:center; margin-top:18px;">
            <a href="/" class="btn-back">← Back to Home</a>
        </div>
    </div>
</div>
<script>
function togglePw(id, btn) {
    const inp = document.getElementById(id);
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
    else { inp.type = 'password'; btn.textContent = '👁'; }
}
const PW_CHECKS = {
    len:   v => v.length >= 8,
    upper: v => /[A-Z]/.test(v),
    lower: v => /[a-z]/.test(v),
    num:   v => /[0-9]/.test(v),
    spec:  v => /[!@#$%^&*()\-_=+\[\]{};':",.<>?/\\|`~]/.test(v)
};
const PW_LABELS = { len:'8+ chars', upper:'Uppercase', lower:'Lowercase', num:'Number', spec:'Special (!@#…)' };
function checkRules(inputId, rulesId) {
    const v = document.getElementById(inputId).value;
    const box = document.getElementById(rulesId);
    box.style.display = v.length ? 'block' : 'none';
    box.querySelectorAll('[data-rule]').forEach(el => {
        const ok = PW_CHECKS[el.dataset.rule](v);
        el.style.color = ok ? '#7c3aed' : '#bbb';
        el.textContent = (ok ? '✓ ' : '✗ ') + PW_LABELS[el.dataset.rule];
    });
}
function pwValid(inputId) {
    const v = document.getElementById(inputId).value;
    return Object.values(PW_CHECKS).every(fn => fn(v));
}
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function checkEmail() {
    const v = document.getElementById('email-reg').value;
    const box = document.getElementById('email-feedback');
    if (!v.length) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    if (EMAIL_RE.test(v)) {
        box.textContent = '✓ Looks good';
        box.style.color = '#7c3aed';
    } else {
        box.textContent = '✗ Enter a valid email address';
        box.style.color = '#e07aad';
    }
}
function emailValid() {
    return EMAIL_RE.test(document.getElementById('email-reg').value);
}
function checkMatch() {
    const pw = document.getElementById('pw-reg').value;
    const confirm = document.getElementById('pw-reg-confirm').value;
    const box = document.getElementById('match-feedback');
    if (!confirm.length) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    if (pw === confirm) {
        box.textContent = '✓ Passwords match';
        box.style.color = '#7c3aed';
    } else {
        box.textContent = '✗ Passwords do not match';
        box.style.color = '#e07aad';
    }
}
function passwordsMatch() {
    return document.getElementById('pw-reg').value === document.getElementById('pw-reg-confirm').value;
}
document.querySelector('form').addEventListener('submit', function(e) {
    if (!emailValid()) {
        e.preventDefault();
        checkEmail();
        document.getElementById('email-reg').focus();
        return;
    }
    if (!pwValid('pw-reg')) {
        e.preventDefault();
        document.getElementById('rules-reg').style.display = 'block';
        document.getElementById('pw-reg').focus();
        return;
    }
    if (!passwordsMatch()) {
        e.preventDefault();
        checkMatch();
        document.getElementById('pw-reg-confirm').focus();
    }
});
</script>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js');
}
</script>
</body>
</html>
